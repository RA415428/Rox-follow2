name: Build Rox Follow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@6.2.1 @capacitor/android@6.2.1
          npm install -D @capacitor/cli@6.2.1

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Copy Unity Rewarded plugin
        run: |
          mkdir -p android/app/src/main/java/com/roxfollow/app
          cp native-integration/android-plugin/java/com/roxfollow/app/UnityRewardedAdsPlugin.java \
             android/app/src/main/java/com/roxfollow/app/UnityRewardedAdsPlugin.java

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/roxfollow/app/MainActivity.java <<'JAVA'
          package com.roxfollow.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(UnityRewardedAdsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Add Unity Ads SDK
        run: |
          sed -i '/dependencies {/a\    implementation "com.unity3d.ads:unity-ads:4.12.2"' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rox-follow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
